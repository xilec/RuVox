# Git hooks — run inside `nix develop` (the toolchain exists only there).
# Installed automatically by the devshell shellHook (`lefthook install`).
# Split: fast checks gate the commit, heavy checks gate the push.
pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      glob: "{src-tauri,tts-normalize,silero-native,tts-contract,teratts}/**/*.rs"
      run: cargo fmt --all -- --check
    ruff:
      glob: "ttsd/**/*.py"
      run: bash -c "cd ttsd && uv run ruff check"
pre-push:
  parallel: true
  commands:
    cargo-clippy:
      run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
    typescript:
      run: pnpm typecheck
    eslint:
      run: pnpm lint
    knip:
      run: pnpm knip
