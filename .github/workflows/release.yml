name: release

# Tag push `v*` (or a manual dispatch with an explicit tag) builds the
# Windows NSIS installer and the Linux .deb/.AppImage packages and publishes
# a DRAFT GitHub release with all artifacts plus the updater manifest
# (latest.json, merged from both platforms by the updater-manifest job)
# attached to it. The draft is published manually after the VM checklist
# passes (OpenSpec change windows-installer-and-release, D1; Linux half =
# issue #218; Linux updater = issue #226).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.3.0)"
        required: true

permissions:
  contents: write # needed to create the draft release

env:
  # cmake 4.x on the runner image errors out on the vendored opus'
  # ancient cmake_minimum_required — pin the compat floor (design D5).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  windows-installer:
    runs-on: windows-latest
    # Observed 12-14 min warm (two builds + NSIS); cold cargo cache ~20 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri\nsilero-native"
          # Shared with the ci.yml windows-build job (same key, same cache).
          shared-key: win-msvc

      - run: pnpm install --frozen-lockfile

      - name: Guard tag matches app version
        shell: bash
        run: bash scripts/guard-tag-version.sh "${{ inputs.tag || github.ref_name }}"

      # mpv + onnxruntime.dll, pinned + sha256-verified. Must happen before
      # `tauri build` because bundle.resources references them.
      - name: Fetch third-party resources
        shell: bash
        run: bash scripts/fetch-windows-resources.sh

      # espeak-ng-data is produced BY the build (espeak-rs-sys vendors and
      # compiles espeak-ng) — so build first, then copy the data out of the
      # build tree, then bundle. The warm-up builds ONLY the lib target as
      # an rlib (`cargo rustc --crate-type=rlib`): no cdylib/staticlib/exe
      # link happens here. Linking the app now would be thrown away — the
      # resource copy below invalidates the app crate anyway (tauri-build
      # emits `rerun-if-changed` for every bundle resource, so the real
      # `tauri build` recompiles + LTO-relinks it regardless). The explicit
      # `--features tauri/custom-protocol` matches what the Tauri CLI adds
      # for production builds (CLI v2: `cargo build --bins --features
      # tauri/custom-protocol`), keeping dependency fingerprints identical
      # so the final build reuses everything compiled here.
      - name: Build frontend (tauri-codegen needs dist/ during cargo build)
        run: pnpm build

      - name: cargo build lib --crate-type=rlib (produces espeak-ng-data)
        run: cargo rustc --release --lib --crate-type=rlib --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Extract espeak-ng-data into bundle resources
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls -d src-tauri/target/release/build/espeak-rs-sys-*/out/share/espeak-ng-data | head -1)
          # Sanity: the Russian pipeline needs these three at minimum.
          test -f "$src/ru_dict" && test -f "$src/phondata" && test -f "$src/intonations"
          # The destination dir exists in the checkout (committed PLACEHOLDER)
          # — `cp -r src dest` would NEST into it. Copy the contents instead.
          cp -r "$src/." src-tauri/resources/espeak-ng-data/
          # Post-copy check at the level the app actually reads
          # (init_platform_env sets PIPER_ESPEAKNG_DATA_DIRECTORY to the dir
          # containing espeak-ng-data).
          test -f src-tauri/resources/espeak-ng-data/ru_dict

      - name: Build NSIS installer + updater artifacts
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The updater manifest (latest.json) is written by the updater-manifest
      # job, which needs both platforms' signatures — this job only uploads
      # its own signature as a workflow artifact.
      - name: Upload NSIS updater signature for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: updater-windows-sig
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig

      # Extract the CHANGELOG.md section for this version so the draft release
      # body is the human-curated notes, not GitHub's auto-generated diff
      # summary (see scripts/release-notes.sh for the matching rules).
      - name: Extract changelog section for release notes
        shell: bash
        run: bash scripts/release-notes.sh "${{ inputs.tag || github.ref_name }}"

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          body_path: release_notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig

  # Linux half of #94, split out by issue #218: build .deb + .AppImage on a
  # Linux runner and attach them to the SAME draft release the Windows job
  # created (same tag_name; softprops/action-gh-release updates an existing
  # draft and merges assets — whichever job finishes first creates it, both
  # write identical release notes via scripts/release-notes.sh). The AppImage
  # doubles as the Linux updater artifact (#226): it is signed AFTER the
  # wayland repack below, because the repack rewrites the file and would
  # invalidate a build-time signature.
  linux-packages:
    runs-on: ubuntu-latest
    # Warm cargo cache ~12-15 min (two-stage build + bundling); cold apt+cargo
    # caches can push past 30 min (apt throttling note in ci.yml applies).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # Same package set as the ci.yml rust job plus patchelf (AppImage
      # bundling); cache-apt-pkgs for the same incident-#204 reason. `version`
      # differs from ci.yml because the package list here is different.
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libmpv-dev pkg-config build-essential patchelf file squashfs-tools
          version: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri\nsilero-native"
          shared-key: linux-gnu-release

      - run: pnpm install --frozen-lockfile

      - name: Guard tag matches app version
        run: bash scripts/guard-tag-version.sh "${{ inputs.tag || github.ref_name }}"

      # Two-stage build, same shape as the Windows job: produce the vendored
      # espeak-ng-data first (espeak-rs-sys emits it into its build tree),
      # copy it into bundle resources (referenced by tauri.linux.conf.json),
      # then let `tauri build` bundle .deb + .AppImage.
      - name: Build frontend (tauri-codegen needs dist/ during cargo build)
        run: pnpm build

      - name: cargo build lib --crate-type=rlib (produces espeak-ng-data)
        run: cargo rustc --release --lib --crate-type=rlib --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Extract espeak-ng-data into bundle resources
        run: |
          set -euo pipefail
          src=$(ls -d src-tauri/target/release/build/espeak-rs-sys-*/out/share/espeak-ng-data | head -1)
          # Sanity: the Russian pipeline needs these three at minimum.
          test -f "$src/ru_dict" && test -f "$src/phondata" && test -f "$src/intonations"
          cp -r "$src/." src-tauri/resources/espeak-ng-data/
          test -f src-tauri/resources/espeak-ng-data/ru_dict

      # Pinned + sha256-verified libonnxruntime for the silero-native engine
      # (ort load-dynamic dlopens it from ORT_DYLIB_PATH, set by the app to
      # the bundled copy). Must replace the committed placeholder before
      # `tauri build` — same rule as the Windows onnxruntime.dll fetch.
      - name: Fetch libonnxruntime into bundle resources
        run: bash scripts/fetch-linux-onnxruntime.sh

      # Pinned + sha256-verified mpv player bundle for the AppImage (#265).
      # The .deb does NOT carry it — it Depends on the system mpv instead
      # (#266) — so the resource is wired through the AppImage-only CLI
      # config overlay and the build is split by bundle type.
      - name: Fetch bundled mpv into AppImage resources
        run: bash scripts/fetch-linux-mpv.sh

      - name: Build .deb package
        run: pnpm tauri build --bundles deb

      - name: Build .AppImage package (bundles mpv via the appimage overlay)
        run: pnpm tauri build --bundles appimage --config src-tauri/tauri.appimage.conf.json

      # Repack the AppImage with GDK_BACKEND autodetection — without this the
      # CI-built AppImage fails to start on pure-Wayland sessions (the local
      # builder applies the same fix; keep the two in sync).
      - name: Apply wayland fix to the AppImage
        run: |
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          bash scripts/fix-appimage-wayland.sh "$appimage" "$appimage"

      # The updater signature must match the file we actually distribute, so
      # signing happens here — after the repack above (the build itself runs
      # without signing env; tauri only warns about the unkeyed pubkey). Same
      # key env contract as the Windows job; `tauri signer sign` reads it
      # directly (#226).
      - name: Sign the repacked AppImage for the updater
        run: |
          set -euo pipefail
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          rm -f "$appimage.sig"
          pnpm tauri signer sign "$appimage"
          test -s "$appimage.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload AppImage updater signature for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: updater-linux-sig
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Extract changelog section for release notes
        run: bash scripts/release-notes.sh "${{ inputs.tag || github.ref_name }}"

      - name: Attach Linux artifacts to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          body_path: release_notes.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  # tauri-plugin-updater manifest (#226): merges the per-platform updater
  # entries from both packaging jobs into the single latest.json the app
  # polls. `releases/latest/download/latest.json` starts resolving only once
  # the draft is PUBLISHED — before that the in-app check 404s, which the
  # app treats as "no update".
  updater-manifest:
    runs-on: ubuntu-latest
    needs: [windows-installer, linux-packages]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*-sig
          merge-multiple: true
          path: sigs

      - name: Generate latest.json updater manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          # Asset names double as the manifest URLs; the sig filename is the
          # asset filename plus ".sig". Tauri v2 signs the plain NSIS
          # installer as the updater artifact (createUpdaterArtifacts: true).
          win_sig_file=$(ls sigs/*_x64-setup.exe.sig | head -1)
          win_asset=$(basename "$win_sig_file" .sig)
          linux_sig_file=$(ls sigs/*.AppImage.sig | head -1)
          linux_asset=$(basename "$linux_sig_file" .sig)
          win_sig=$(cat "$win_sig_file")
          linux_sig=$(cat "$linux_sig_file")
          jq -n \
            --arg v "$version" \
            --arg tag "$tag" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$win_sig" \
            --arg win_url "$base/$win_asset" \
            --arg linux_sig "$linux_sig" \
            --arg linux_url "$base/$linux_asset" \
            '{version: $v, notes: "https://github.com/${{ github.repository }}/releases/tag/\($tag)", pub_date: $date,
              platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "linux-x86_64": {signature: $linux_sig, url: $linux_url}
              }}' \
            > latest.json
          cat latest.json

      - name: Attach the manifest to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: latest.json
