[package]
name = "tts-normalize"
version = "0.1.0"
description = "Text normalization pipeline, user dictionary and per-engine text profiles for TTS"
authors = []
license = "GPL-3.0-only"
repository = "https://github.com/xilec/RuVox"
edition = "2024"
rust-version = "1.85"

[dependencies]
tts-contract = { path = "../tts-contract" }
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
test-case = "3"
