# Dates: numeric formats, written dates, years, decades and clock times.
#
# `locked` cases pin behavior the pipeline already gets right; `target` cases
# are the natural reading phases B and C implement (see README.md).

# ── locked: numeric formats already read correctly ───────────────────────────

[[case]]
id = "dates/iso-release"
subcategory = "iso"
status = "locked"
input = "Релиз 2024-12-31"
expected = "Релиз тридцать первое декабря две тысячи двадцать четвёртого года"
note = "a date used as a label reads nominative; a date after 'от'/'до' takes the genitive (date-after-ot, date-after-do)"

[[case]]
id = "dates/iso-deadline"
subcategory = "iso"
status = "locked"
input = "Дедлайн 2000-01-01"
expected = "Дедлайн первое января двухтысячного года"

[[case]]
id = "dates/iso-parenthesized"
subcategory = "iso"
status = "locked"
input = "(2024-12-31)"
expected = "(тридцать первое декабря две тысячи двадцать четвёртого года)"

[[case]]
id = "dates/iso-sentence-final"
subcategory = "iso"
status = "locked"
input = "Релиз 2024-12-31."
expected = "Релиз тридцать первое декабря две тысячи двадцать четвёртого года."

[[case]]
id = "dates/eu-dotted"
subcategory = "eu-dotted"
status = "locked"
input = "Дата: 15.01.2024"
expected = "Дата: пятнадцатое января две тысячи двадцать четвёртого года"

[[case]]
id = "dates/eu-dotted-year-start"
subcategory = "eu-dotted"
status = "locked"
input = "01.12.2023"
expected = "первое декабря две тысячи двадцать третьего года"

[[case]]
id = "dates/time-hours-minutes"
subcategory = "time"
status = "locked"
input = "Встреча в 10:30"
expected = "Встреча в десять часов тридцать минут"

[[case]]
id = "dates/time-with-seconds"
subcategory = "time"
status = "locked"
input = "Запись 08:00:00"
expected = "Запись восемь часов"

[[case]]
id = "dates/time-out-of-range"
subcategory = "time"
status = "locked"
input = "В 25:00 встреча"
expected = "В двадцать пять:ноль встреча"
note = "spec scenario: an invalid clock time falls through to the number phase"

[[case]]
id = "dates/date-and-time"
subcategory = "time"
status = "locked"
input = "Дата 31.12.2024 23:59"
expected = "Дата тридцать первое декабря две тысячи двадцать четвёртого года двадцать три часа пятьдесят девять минут"

