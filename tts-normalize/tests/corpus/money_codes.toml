# Money, reference markers (№, стр., рис., гл.), phones and identifiers.
#
# Nothing in this category is read correctly today, so every case is `target`.

[[case]]
id = "money/rubles-sign"
subcategory = "currency"
status = "target"
input = "100 ₽"
expected = "сто рублей"

[[case]]
id = "money/rubles-sign-groups"
