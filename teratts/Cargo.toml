[package]
name = "teratts"
version = "0.1.0"
description = "In-process TeraTTSv2 engine on ONNX Runtime (RU/EN flow-matching TTS, no Python)"
authors = []
license = "GPL-3.0-only"
repository = "https://github.com/xilec/RuVox"
edition = "2024"
rust-version = "1.85"

# `ort`/`ort-sys` pins mirror src-tauri/Cargo.toml exactly (see the long
# comment there): `load-dynamic` + `disable-linking` mean onnxruntime is
# dlopened at runtime from `ORT_DYLIB_PATH` instead of fetched at build time,
# which does not work inside the nix sandbox. Feature unification with
# src-tauri (which depends on this crate by path) requires identical flags.
[dependencies]
tts-contract = { path = "../tts-contract" }
# NOTE: do not add `default-features = false` here — with ort rc.12 the
# minimal feature set miscompiles against the ort-sys bindings (same reason
# as silero-native/Cargo.toml).
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.12", default-features = false, features = ["disable-linking"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
hound = "3"
rand = "0.9"
regex = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = "line-tables-only"
