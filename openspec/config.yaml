schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Project: RuVox 2.0 — desktop app for fast narration of Russian-language texts
  and articles where quickly understanding the content comes first and speech
  beauty is secondary (technical articles are a typical example). The listener
  takes the load off eyes strained by a day of reading. Positioning: fast
  lightweight engines + normalization as a compensating layer (imitate a
  competent reading of unreadable fragments instead of skipping them) + in-app
  text with per-word highlighting as the fallback for unclear spots.
  Stack: Tauri 2 shell (Rust + native webview), React 18 + TypeScript 5 + Mantine 8
  frontend, Rust backend (normalization pipeline, storage, ttsd subprocess manager,
  mpv player wrapper), Python 3.12 `ttsd` sidecar wrapping Silero TTS (uv-managed).
  Key constraint: Silero TTS cannot read English or special characters — the
  normalization pipeline must transliterate all English text to Cyrillic before TTS.
  All tooling runs via `nix develop -c "..."` (cargo/pnpm/uv exist only in the dev shell).
  Code and comments in English; user-facing UI strings in Russian. No emoji.
  Commit format: `<type>(<module>): <desc>`, English.
  Hard rules: ai/rules/conventions.md; craft standard: ai/rules/code-quality.md.
  Domain glossary: CONTEXT.md — canonical terms and avoid-lists.
  Package manager: pnpm (chosen over bun for Nix build reproducibility:
  `pnpm.fetchDeps` fixed-output derivation in flake.nix, diffable text lockfile,
  mature nixpkgs packaging, no Node runtime replacement; bun's install speed
  advantage is negated by the Nix store cache).

# Per-artifact rules.
rules:
  proposal:
    - Always include a "Non-goals" section
    - Keep one reviewable change per proposal; split otherwise
  specs:
    - Use Given/When/Then format for scenarios
    - Reference existing behavior and patterns before inventing new ones
    - Every scenario must be implementable as a single unit test or golden fixture
  design:
    - Record rejected alternatives with the reason, not just the chosen option
  tasks:
    - Include an explicit validation group (tests, typecheck, lint) at the end
    - Each task must be completable in one working session
