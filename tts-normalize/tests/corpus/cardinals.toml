# Cardinal numerals: integers, digit groups, decimals, units and codes.
#
# Sizes in engine units (KB/MB/GB, ms/sec/min) are covered by the size phase;
# the metric and currency units below are not implemented yet, hence `target`.

# ── locked: plain integers and engine size units ─────────────────────────────

[[case]]
id = "cardinals/small-int"
subcategory = "integer"
status = "locked"
input = "5 яблок"
expected = "пять яблок"

[[case]]
id = "cardinals/thousand-rubles"
subcategory = "integer"
status = "target"
input = "1000 рублей"
expected = "тысяча рублей"
note = "a lone scale word drops 'одна': 'тысяча рублей', not 'одна тысяча рублей'"

[[case]]
id = "cardinals/million-rubles"
subcategory = "integer"
status = "target"
input = "1000000 рублей"
expected = "миллион рублей"
note = "same scale policy as 'тысяча рублей'"

[[case]]
id = "cardinals/zero"
subcategory = "integer"
status = "locked"
input = "0"
expected = "ноль"

[[case]]
id = "cardinals/plain-int"
subcategory = "integer"
status = "locked"
input = "123"
expected = "сто двадцать три"

[[case]]
id = "cardinals/size-mb"
subcategory = "engine-unit"
status = "locked"
input = "100MB"
expected = "сто мегабайт"

[[case]]
id = "cardinals/duration-ms"
subcategory = "engine-unit"
status = "locked"
input = "50ms"
expected = "пятьдесят миллисекунд"

[[case]]
id = "cardinals/size-gb"
subcategory = "engine-unit"
status = "locked"
input = "16GB"
expected = "шестнадцать гигабайт"

[[case]]
id = "cardinals/em-unit"
subcategory = "engine-unit"
status = "locked"
input = "1.5em"
expected = "один точка пять эм"

[[case]]
id = "cardinals/version"
subcategory = "engine-unit"
status = "locked"
input = "v2.3.1"
expected = "два точка три точка один"

# ── target: digit groups and decimal fractions ───────────────────────────────

[[case]]
id = "cardinals/group-space-ten-thousand"
subcategory = "groups"
status = "target"
input = "10 000 рублей"
expected = "десять тысяч рублей"

[[case]]
id = "cardinals/group-space-million"
subcategory = "groups"
status = "target"
input = "1 000 000 долларов"
expected = "миллион долларов"

[[case]]
id = "cardinals/group-space-1500"
subcategory = "groups"
status = "target"
input = "1 500"
expected = "тысяча пятьсот"

[[case]]
id = "cardinals/group-nbsp"
subcategory = "groups"
status = "target"
input = "10\u00a0000"
expected = "десять тысяч"
note = "U+00A0 written as a TOML escape; the ASCII-space control is group-space-ten-thousand"

[[case]]
id = "cardinals/feminine-42"
subcategory = "agreement"
status = "target"
input = "42 книги"
expected = "сорок две книги"

[[case]]
id = "cardinals/feminine-21"
subcategory = "agreement"
status = "target"
input = "21 книга"
expected = "двадцать одна книга"

[[case]]
id = "cardinals/feminine-2"
subcategory = "agreement"
status = "target"
input = "2 девочки"
expected = "две девочки"

[[case]]
id = "cardinals/decimal-half-kg"
subcategory = "decimal"
status = "target"
input = "1,5 кг"
expected = "полтора килограмма"

[[case]]
id = "cardinals/decimal-half-feminine"
subcategory = "decimal"
status = "target"
input = "1,5 недели"
expected = "полторы недели"

[[case]]
id = "cardinals/decimal-two-five-km"
subcategory = "decimal"
status = "target"
input = "2,5 км"
expected = "два с половиной километра"

[[case]]
id = "cardinals/decimal-zero-five-l"
subcategory = "decimal"
status = "target"
input = "0,5 л"
expected = "ноль целых пять десятых литра"

[[case]]
id = "cardinals/decimal-1-25-m"
subcategory = "decimal"
status = "target"
input = "1,25 м"
expected = "одна целая двадцать пять сотых метра"

[[case]]
id = "cardinals/decimal-3-75-kg"
subcategory = "decimal"
status = "target"
input = "3,75 кг"
expected = "три целых семьдесят пять сотых килограмма"

[[case]]
id = "cardinals/decimal-dot-pi"
subcategory = "decimal"
status = "locked"
input = "3.14"
expected = "три точка четырнадцать"
note = "a bare decimal keeps the technical register (точка), like versions and coordinates"

[[case]]
id = "cardinals/decimal-dot-half"
subcategory = "decimal"
status = "locked"
input = "0.5"
expected = "ноль точка пять"

[[case]]
id = "cardinals/decimal-hours"
subcategory = "decimal"
status = "target"
input = "1,5 часа"
expected = "полтора часа"

[[case]]
id = "cardinals/group-decimal"
subcategory = "decimal"
status = "target"
input = "1 234,56"
expected = "одна тысяча двести тридцать четыре целых пятьдесят шесть сотых"

