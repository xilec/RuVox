# Ordinal numerals: suffixed forms (`5-й`, `21-го`, …), list markers and
# context-driven ordinals ("глава 2").

# ── locked: Markdown list markers ────────────────────────────────────────────

[[case]]
id = "ordinals/list-marker-one"
subcategory = "list-marker"
status = "locked"
input = "1. Первый пункт"
expected = "первое:Первый пункт"

[[case]]
id = "ordinals/list-marker-two"
subcategory = "list-marker"
status = "locked"
input = "2. Второй пункт"
expected = "второе:Второй пункт"

[[case]]
id = "ordinals/list-marker-ten"
subcategory = "list-marker"
status = "locked"
input = "10. Десятый пункт"
expected = "десятое:Десятый пункт"

[[case]]
id = "ordinals/list-marker-eleven"
subcategory = "list-marker"
status = "locked"
input = "11. Одиннадцатый пункт"
expected = "одиннадцать:Одиннадцатый пункт"
note = "spec: 1-10 read as ordinals, larger numbers as cardinals"

