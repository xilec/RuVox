[workspace]
resolver = "3"
members = ["src-tauri", "teratts", "tts-contract", "tts-normalize", "silero-native"]

# Workspace root on purpose: cargo resolves a git dependency by package name
# against the repository's workspace members, so the DSH sidecar can depend on
# `tts-normalize` and `teratts` straight from this repository. Profiles live here
# because cargo ignores the profile tables of non-root packages.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

# The pure-Rust Opus codec is hot on every save, and its scalar glue and
# run-time dispatch lose ~40 % at the size-optimized opt-level (the C libopus
# it replaced was built at -O2 by Nix). Compile just this crate for speed
# (issue #19).
[profile.release.package.opus1]
opt-level = 3

[profile.dev]
incremental = true
