name: Bug report
description: Something isn't working in RuVox
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to file a bug. Please search
        [existing issues](https://github.com/xilec/RuVox/issues?q=is%3Aissue) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RuVox version
      description: The release tag (e.g. v0.4.0) or the commit the app was built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach the relevant file from the logs folder (Settings → open logs).
