id = "money_codes/number-sign"
subcategory = "reference"
status = "target"
input = "№ 5"
expected = "номер пять"

[[case]]
id = "money_codes/number-sign-glued"
subcategory = "reference"
status = "target"
input = "№123"
expected = "номер сто двадцать три"

[[case]]
id = "money_codes/page-reference"
subcategory = "reference"
status = "target"
input = "стр. 15"
expected = "страница пятнадцать"

[[case]]
id = "money_codes/table-reference"
subcategory = "reference"
status = "target"
input = "табл. 3"
expected = "таблица три"

[[case]]
id = "money_codes/figure-reference"
subcategory = "reference"
status = "target"
input = "рис. 3"
expected = "рисунок три"

[[case]]
id = "money_codes/chapter-reference"
subcategory = "reference"
status = "target"
input = "гл. 2"
expected = "глава вторая"
note = "a chapter reference is an ordinal, unlike a page number"

[[case]]
id = "money_codes/phone"
subcategory = "phone"
status = "target"
input = "тел. +7 999 123-45-67"
expected = "телефон плюс семь девятьсот девяносто девять сто двадцать три сорок пять шестьдесят семь"
note = "a phone number is read in groups, unlike digit-by-digit IDs"

[[case]]
id = "money_codes/inn"
subcategory = "identifier"
status = "target"
input = "ИНН 7707083893"
expected = "ИНН семь семь ноль семь ноль восемь три восемь девять три"

[[case]]
id = "money_codes/article"
subcategory = "identifier"
status = "target"
input = "арт. 123456"
expected = "артикул один два три четыре пять шесть"

[[case]]
id = "money_codes/plus-sign"
subcategory = "sign"
status = "target"
input = "+5"
expected = "плюс пять"

