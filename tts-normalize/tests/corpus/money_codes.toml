[[case]]
id = "money_codes/page-five"
subcategory = "reference"
status = "target"
input = "стр. 5"
expected = "страница пять"

[[case]]
id = "money_codes/ruble-one"
subcategory = "agreement"
status = "locked"
input = "1 рубль"
expected = "один рубль"

[[case]]
id = "money_codes/ruble-two"
subcategory = "agreement"
status = "locked"
input = "2 рубля"
expected = "два рубля"

[[case]]
id = "money_codes/ruble-twenty-two"
subcategory = "agreement"
status = "locked"
input = "22 рубля"
expected = "двадцать два рубля"

[[case]]
id = "money_codes/kopecks"
subcategory = "agreement"
status = "target"
input = "50 коп."
expected = "пятьдесят копеек"

[[case]]
id = "money_codes/city-abbreviation"
subcategory = "reference"
status = "target"
input = "г. Москва"
expected = "город Москва"
note = "the 'г.' homograph: city here, year in dates/year-abbreviation"

[[case]]
id = "money_codes/dollars-two"
subcategory = "currency"
status = "locked"
input = "$2"
expected = "два доллара"

[[case]]
id = "money_codes/dollars-twenty-one"
subcategory = "currency"
status = "locked"
input = "$21"
expected = "двадцать один доллар"
note = "the prefix noun agrees with the count: 'двадцать один доллар', not 'долларов'"

[[case]]
id = "money_codes/dollars-about-one"
subcategory = "currency"
status = "locked"
input = "около $1"
expected = "около одного доллара"

[[case]]
id = "money_codes/dollars-and-half"
subcategory = "currency"
status = "locked"
input = "$1,5"
expected = "полтора доллара"
note = "a fractional prefix count takes the genitive singular, not the nominative"

[[case]]
id = "money_codes/million-about-one"
subcategory = "scale"
status = "locked"
input = "около 1 млн рублей"
expected = "около миллиона рублей"
note = "a lone scale word keeps the case: 'около миллиона', not 'около миллион'"

[[case]]
id = "money_codes/usd-word"
subcategory = "currency"
status = "locked"
input = "5 USD"
expected = "пять долларов"

[[case]]
id = "money_codes/ruble-abbreviation"
subcategory = "currency"
status = "locked"
input = "5 р."
expected = "пять рублей"
