name: CI

# Every job must declare `timeout-minutes` sized at ~2-3x its worst observed
# duration: after the 2026-08-19 apt-mirror throttling incident (#204) a hung
# step must fail fast with logs instead of idling until the 6h GitHub default.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      ttsd: ${{ steps.filter.outputs.ttsd }}
      nix: ${{ steps.filter.outputs.nix }}
      openspec: ${{ steps.filter.outputs.openspec }}
      windows: ${{ steps.filter.outputs.windows }}
      nonnix: ${{ steps.filter.outputs.nonnix }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'silero-native/**'
              - '.github/workflows/ci.yml'
            typescript:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'eslint.config.js'
              - 'knip.json'
              - '.github/workflows/ci.yml'
            ttsd:
              - 'ttsd/**'
              - '.github/workflows/ci.yml'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/devshell.nix'
              - '.github/workflows/ci.yml'
            openspec:
              - 'openspec/**'
              - '.github/workflows/ci.yml'
            windows:
              - 'src-tauri/**'
              - 'silero-native/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'scripts/fetch-windows-resources.sh'
            nonnix:
              - 'src-tauri/**'
              - 'silero-native/**'
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'docs/install.md'
              - '.github/workflows/ci.yml'

  # Compile-only guard for the Windows port: catches cfg/platform breakage
  # on the real MSVC toolchain without bundling (no resource downloads, no
  # NSIS). The full installer path lives in release.yml.
  windows-build:
    name: Windows build (no bundle)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    # Warm cache ~6-9 min; cold MSVC rebuild of all deps ~15 min.
    timeout-minutes: 20
    env:
      # cmake 4.x on the runner image errors out on the vendored opus'
      # ancient cmake_minimum_required — pin the compat floor (design D5
      # of windows-installer-and-release).
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri\nsilero-native"
          # Shared with the release.yml windows-installer job: without this the
          # cache key includes the job id, so the release rebuilt all ~600 deps
          # from scratch on every run (~8.5 min lost).
          shared-key: win-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle


  # End-to-end guard for docs/install.md (the non-Nix build path, #230):
  # builds the app on a stock ubuntu-24.04 runner with the same system
  # packages the guide prescribes, so drift between the doc and the real
  # dependency set fails CI instead of a user's machine. Bundling is
  # skipped (--no-bundle) to keep the job lean (no AppImage bundler
  # downloads); the deb/AppImage bundle path is covered by release.yml.
  nonnix-build:
    name: Non-Nix build (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.nonnix == 'true'
    runs-on: ubuntu-24.04
    # Cold run, unmeasured estimate: ~5 min apt + ~20 min cold release
    # build + frontend install; 60 min gives the house 2-3x headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the system packages from docs/install.md (Ubuntu block)
        # cache-apt-pkgs for the same reason as the rust job below (#204:
        # throttled apt mirrors turned a raw install into a 40-60 min hang).
        # The list must stay a mirror of the doc's Ubuntu block — mpv
        # included: it is exactly the kind of drift this job exists to catch.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: build-essential pkg-config cmake clang libclang-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libmpv-dev mpv libopus-dev libssl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libfontconfig1-dev libfreetype6-dev libgl-dev libdrm-dev libwayland-dev libxkbcommon-dev wayland-protocols espeak-ng espeak-ng-data curl file git
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri\nsilero-native"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - name: ONNX Runtime dylib (Piper engine, dlopened at run time)
        run: |
          ORT_VERSION=1.20.1
          mkdir -p "$HOME/.local/onnxruntime"
          curl -L -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf /tmp/onnxruntime.tgz -C "$HOME/.local/onnxruntime" --strip-components=1
          echo "ORT_DYLIB_PATH=$HOME/.local/onnxruntime/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle


  rust:
    name: Rust (clippy + test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Warm run 3-10 min; cold apt/cargo caches can push it to ~20-25 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # cache-apt-pkgs after the 2026-08-19 incident: azure.archive.ubuntu.com
      # throttled package downloads to KB/s, so raw apt-get install of the
      # webkit/mpv dev tree (~140 packages incl. libav*) hung for 40-60 min
      # on two consecutive runs. On cache hit this restores .debs from the
      # Actions cache in seconds and skips the mirror entirely; on miss it
      # installs and populates the cache. Bump `version` to refresh.
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libmpv-dev pkg-config build-essential
          version: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri\nsilero-native"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path silero-native/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --no-deps -- -D warnings
      - run: cargo clippy --manifest-path silero-native/Cargo.toml --all-targets --no-deps -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - run: cargo test --manifest-path silero-native/Cargo.toml

  typescript:
    name: TypeScript (typecheck + vitest)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test:unit

  ttsd:
    name: ttsd (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.ttsd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - working-directory: ttsd
        run: uv sync --group dev
      - working-directory: ttsd
        run: uv run ruff check
      - working-directory: ttsd
        run: uv run python -m pytest

  nix:
    name: Nix (eval slim/full flake)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Eval all flake outputs
        run: nix flake check --no-build
      - name: Slim .#ruvox does not pull in ttsd at the derivation level
        run: |
          set -euo pipefail
          drvs=$(nix derivation show .#ruvox | jq -r '(if has("derivations") then .derivations else . end) | to_entries[0].value | (.inputDrvs // .inputs.drvs) | keys[]')
          echo "$drvs" | grep -i ttsd && {
            echo "::error::slim .#ruvox derivation pulls in ttsd; this defeats the withSilero=false default"
            exit 1
          } || true
      - name: Full .#ruvox-with-silero does pull in ttsd
        run: |
          set -euo pipefail
          drvs=$(nix derivation show .#ruvox-with-silero | jq -r '(if has("derivations") then .derivations else . end) | to_entries[0].value | (.inputDrvs // .inputs.drvs) | keys[]')
          echo "$drvs" | grep -qi ttsd || {
            echo "::error::full .#ruvox-with-silero derivation does not pull in ttsd"
            exit 1
          }

  openspec:
    name: OpenSpec (validate specs)
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      # Cache the pnpm store so `pnpm dlx` doesn't re-download the openspec
      # CLI on every run (the job installs no repo dependencies).
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-openspec
      # Static drift-gate for the spec source of truth: invalid spec/change
      # files (bad requirement/scenario format) fail the build. No LLM
      # involved — this is the openspec CLI's schema validator.
      - run: pnpm dlx @fission-ai/openspec@1.6.0 validate --specs --strict
